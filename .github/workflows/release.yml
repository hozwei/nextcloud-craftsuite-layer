# SPDX-FileCopyrightText: 2026 The nextcloud-craftsuite-layer contributors
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes a release when a version tag is pushed (v0.1.0 for version 0.1.0 in
# craftsuite_layer/appinfo/info.xml). Its assets:
#
#   craftsuite_layer-<version>.tar.gz          the Nextcloud app, as built for the App Store
#                                              (unpack into the server's custom_apps/)
#   craftsuite-layer-hosting-<version>.tar.gz  hosting/inject-translator.sh with the translators
#                                              it injects, apps.json (the supported apps), the
#                                              nginx template and the Compose example, for a
#                                              release updater
#   SHA256SUMS                                 checksums of both
#
# A release updater takes a pinned version from
# https://github.com/<owner>/<repo>/releases/download/v<version>/<asset>: plain downloads, no
# GitHub API (and so none of its rate limit). The steps for a release are in docs/development.md.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag, the app's version, the translator's version and the changelogs must agree, so a
      # release cannot ship with a stale number.
      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' craftsuite_layer/appinfo/info.xml)
          layer=$(sed -n "s/.*const LAYER_VERSION = '\([^']*\)'.*/\1/p" translators/core.js)
          fail=0
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version $version in craftsuite_layer/appinfo/info.xml."
            fail=1
          fi
          if [ "$layer" != "$version" ]; then
            echo "::error::translators/core.js has LAYER_VERSION $layer, info.xml $version: release them together."
            fail=1
          fi
          for changelog in CHANGELOG.md craftsuite_layer/CHANGELOG.md; do
            if ! grep -Eq "^## \[$(printf '%s' "$version" | sed 's/[.]/\\./g')\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" "$changelog"; then
              echo "::error file=$changelog::No section '## [$version] - <YYYY-MM-DD>' (with the release date)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # See ci.yml: no dev dependency needs an install script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          make -C craftsuite_layer appstore
          cp craftsuite_layer/build/artifacts/craftsuite_layer.tar.gz "$out/craftsuite_layer-$VERSION.tar.gz"

          # The injector finds the translators in ../translators next to it, so the bundle keeps
          # the repository's layout.
          bundle="craftsuite-layer-hosting-$VERSION"
          stage="$RUNNER_TEMP/stage/$bundle"
          mkdir -p "$stage/hosting/nginx" "$stage/translators"
          cp hosting/inject-translator.sh hosting/README.md hosting/compose.example.yaml "$stage/hosting/"
          cp hosting/nginx/craft-apps.conf.template "$stage/hosting/nginx/"
          cp translators/*.js translators/README.md "$stage/translators/"
          cp apps.json LICENSE "$stage/"
          tar -C "$RUNNER_TEMP/stage" --format=gnu --sort=name --owner=0 --group=0 --numeric-owner \
            --mode=u+rwX,go+rX,go-w -cf - "$bundle" | gzip -9n > "$out/$bundle.tar.gz"

          (cd "$out" && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The app's changelog section for this version (the App Store shows the same text).
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' craftsuite_layer/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          base="https://github.com/$GITHUB_REPOSITORY/blob/$TAG"
          {
            echo
            echo '### Assets'
            echo
            echo "- \`craftsuite_layer-$VERSION.tar.gz\`: the Nextcloud app. Unpack it into the server's \`custom_apps/\` and run \`occ app:enable craftsuite_layer\` ([docs/nextcloud-app.md]($base/docs/nextcloud-app.md#installing))."
            echo "- \`craftsuite-layer-hosting-$VERSION.tar.gz\`: \`hosting/inject-translator.sh\` with the translators it injects, \`apps.json\` with the supported apps, the nginx template and the Compose example, for the web server of the Craft apps ([docs/hosting.md]($base/docs/hosting.md))."
            echo "- \`SHA256SUMS\`: check both with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "The full list of changes to the repository is in [CHANGELOG.md]($base/CHANGELOG.md)."
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/assets/*.tar.gz "$RUNNER_TEMP/assets/SHA256SUMS"

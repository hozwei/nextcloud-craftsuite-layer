# Copyright and license of the files that cannot carry an SPDX header of their own, in the format
# of the REUSE specification 3.3 (https://reuse.software/spec-3.3/). Every other file has the
# header itself. LICENSE is the license text itself; the specification does not cover files
# named LICENSE, so it needs no entry.
version = 1

# JSON has no comments.
[[annotations]]
path = [
  "package.json",
  "package-lock.json",
  "tests/e2e/craft-versions.json",
  "tests/e2e/tsconfig.json",
  "craftsuite_layer/composer.json",
  "craftsuite_layer/tsconfig.json",
  "craftsuite_layer/l10n/*.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The nextcloud-craftsuite-layer contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Test fixtures: written by the make-fixtures.mjs scripts next to them, or saved by the Craft app
# from our own inputs (see the app pages in docs/apps/). Binary or data formats without room for a
# header; the generator scripts carry their own.
[[annotations]]
path = [
  "tests/e2e/fixtures/*.pdf",
  "tests/e2e/fixtures/photocraft/**/*.psd",
  "tests/e2e/fixtures/photocraft/*.png",
  "tests/e2e/fixtures/vectorcraft/*.vectorcraft",
  "tests/e2e/fixtures/vectorcraft/*.svg",
  "tests/e2e/fixtures/designcraft/*.designcraft",
  "tests/e2e/fixtures/designcraft/*.idml",
  "tests/e2e/fixtures/wordcraft/*.docx",
  "tests/e2e/fixtures/wordcraft/*.odt",
  "tests/e2e/fixtures/wordcraft/*.rtf",
  "tests/e2e/fixtures/gridcraft/craftsuite-probe.xlsx",
  "tests/e2e/fixtures/gridcraft/from-excel.xlsx",
  "tests/e2e/fixtures/gridcraft/*.xlsm",
  "tests/e2e/fixtures/gridcraft/*.ods",
  "tests/e2e/fixtures/gridcraft/*.csv",
  "tests/e2e/fixtures/deckcraft/*.deckcraft",
  "tests/e2e/fixtures/deckcraft/*.pptx",
  "tests/e2e/fixtures/cadcraft/*.dxf",
  "tests/e2e/fixtures/lightcraft/*.jpg",
  "tests/e2e/fixtures/lightcraft/**/*.tif",
  "tests/e2e/fixtures/lightcraft/*.dng",
  "tests/e2e/fixtures/effectcraft/*.ecproj",
  "tests/e2e/fixtures/effectcraft/*.ecprojx",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The nextcloud-craftsuite-layer contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# GridCraft's 'Quarterly Sales Dashboard' sample (engine/src/sample.rs), saved by GridCraft 0.5.0:
# upstream content under upstream's license.
[[annotations]]
path = "tests/e2e/fixtures/gridcraft/sales-sample.xlsx"
precedence = "override"
SPDX-FileCopyrightText = "2026 ArtCraft Team and the GridCraft contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# FilmCraft 0.6.0's save of its own demo project and that project's EDL export (see
# docs/apps/filmcraft.md), and the copies tests/e2e/fixtures/filmcraft/make-fixtures.mjs derives
# from them. The demo project's content comes from FilmCraft (crates/engine/src/demo.rs).
[[annotations]]
path = [
  "tests/e2e/fixtures/filmcraft/*.fcproj",
  "tests/e2e/fixtures/filmcraft/*.edl",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 ArtCraft Team and the FilmCraft contributors",
  "2026 The nextcloud-craftsuite-layer contributors",
]
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Written by craftsuite_layer/l10n.mjs from l10n/*.json, in the format Nextcloud's translationtool
# writes (no room for a header).
[[annotations]]
path = "craftsuite_layer/l10n/*.js"
precedence = "override"
SPDX-FileCopyrightText = "2026 The nextcloud-craftsuite-layer contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Craft apps' own icons, shown in Files for the file types each app opens
# (craftsuite_layer/lib/Service/MimeIcons.php). Taken from each app's assets/app-icon/ at the tested
# tag: <app>-small.svg (DeckCraft: hicolor/scalable/apps/ai.storyteller.deckcraft.svg) with the
# viewBox narrowed to "22 22 468 468", the crop the apps' own packaging uses for small sizes, and
# CADCraft's hicolor/512x512/apps/ai.storyteller.cadcraft.png, unchanged. The ArtCraft marks are
# not among them. The app package carries the MIT notices in img/types/LICENSE-MIT.txt.
[[annotations]]
path = "craftsuite_layer/img/types/photocraft.svg"
precedence = "override"

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>craftsuite-layer test host</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-rows: auto 1fr 150px; font: 13px system-ui, sans-serif; background: #f4f5f7; }

  <pre id="log"></pre>
  <script src="config.js"></script>
  <script src="host.js"></script>
</body>
</html>
